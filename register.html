        <h2>Create Your Account</h2>
        <form>
            <ladel for="firstName">First Name</ladel>
            <input type="text"
            id="firstName" name="firstName"
            placeholder="Dilane" required><br>
 
            <label for="LastName">Last Name</label>
            <input type="text" id="LastName"
            name="LastName" placeholder="Bogne" required><br>

            <label for="Sex"><b>Sex</b>
              <select>
           <option>Male</option>
           <option>Female</option>
        </select><br>

            <ladel for="Date of Birth">Date of Birth</ladel>
            <input type="date" placeholder="01/01/1990" required><br>

            <label for="email">Email Address</label>
            <input type="email" id="email"name="email"
            placeholder="john@example.com" required><br>  
            
            <label for="password">password</label>
            <input type="password" id="password" name="password"
            placeholder="Enter password" required><br>

            <label for="ConfirmPassword">ConfirmPassword</label>
            <input type="password" id="ConfirmPassword" name="ConfirmPassword"
            placeholder="Repeat password" required><br>

            <label for="Country">Country

                <option>Italy</option>
                <option>Spain</option>

                <option>France</option>

                <option>Tunisia</option>
                <option>Senegal</option>
                <option>South Africa</option>
            </select>
            </label><br>
                
            <div class="checbox">
                <input type="checkbox" id="term"required>
                <label for="term">I agree to the Terms and Conditions</label>
            </div>
            <button type="submit">Sign UP</button>
            <div class="login-link">
                Already have an accoumt? 
                <a href="#">log in</a>
            </div>
